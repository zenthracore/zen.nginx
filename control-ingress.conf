# ==============================================================================
# ZENTHRACORE CONTINUITY - CONTROL INGRESS GATE (control.zenthracore.com)
# ==============================================================================

# IP Allowlist Map for Agent Control Plane
geo $remote_addr $allowed_agent {
    default 0;
    include /etc/nginx/conf.d/allowed_agents.map;
}

server {
    listen 443 ssl;
    http2 on;
    server_name control.zenthracore.com;

    # TLS termination (Let's Encrypt / Edge TLS)
    ssl_certificate /etc/letsencrypt/live/control.zenthracore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.zenthracore.com/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # mTLS client certificate verification (Continuity Agent CA)
    # Agents present their signed certificate on subsequent RPCs
    ssl_client_certificate /etc/continuity/certs/agent-ca.crt;
    ssl_verify_client optional_no_ca;

    # ZERO-TRUST PERIMETER GATE:
    # If incoming IP is not explicitly allowlisted in allowed_agents.map,
    # DROP the connection immediately (return 444 - No Response).
    # External port scanners, crawlers and botnets see this port as dead.
    if ($allowed_agent = 0) {
        return 444;
    }

    # gRPC proxy to agent-control microservice
    location / {
        grpc_pass grpc://continuity-agent-control:8082;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_set_header Host $host;

        client_max_body_size 64M;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}
